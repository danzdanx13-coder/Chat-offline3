<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Offline</title>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--text:#111b21;--sub:#667781;--green:#008069;--out:#d9fdd3;--in:#fff;--chat:#efeae2;--line:#e9edef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--green:#00a884;--out:#005c4b;--in:#202c33;--chat:#0b141a;--line:#222d34}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
svg{display:block}
.app{height:100%;max-width:520px;margin:0 auto;background:var(--panel);position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel);transition:transform .22s}
#chat{transform:translateX(100%);background:var(--chat)}
.open #chat{transform:none}
.top{background:var(--green);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{font-size:20px;font-weight:600;flex:1}
.ico{padding:6px;color:#fff;border-radius:50%}
.tabs{display:flex;background:var(--green)}.tabs button{flex:1;padding:10px;color:#fff;opacity:.7;font-weight:600;border-bottom:3px solid transparent}.tabs button.on{opacity:1;border-color:#fff}
.search{padding:8px 12px}.search input{width:100%;padding:9px 14px;border-radius:20px;border:0;background:var(--bg)}
.list{flex:1;overflow-y:auto}
.item{display:flex;gap:12px;padding:10px 14px;width:100%;text-align:left;align-items:center}
.item:active{background:var(--bg)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:600;display:flex;align-items:center;gap:4px}
.time{font-size:12px;color:var(--sub)}
.last{color:var(--sub);font-size:14px;display:flex;align-items:center;gap:4px}.last span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cnt{background:var(--green);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;text-align:center;flex:none}
.empty,.note{text-align:center;color:var(--sub);padding:40px 24px;font-size:14px}
.fab{position:absolute;right:18px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.ring{padding:2px;border-radius:50%;border:2.5px solid var(--green)}
.lt{padding:8px 14px;color:var(--green);font-weight:600;font-size:13px}
.tt{flex:1;min-width:0;cursor:pointer}.tt h1{font-size:17px;display:flex;align-items:center;gap:5px}.tt .time{color:#fff;opacity:.85}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.b{max-width:82%;padding:6px 9px 4px;border-radius:9px;background:var(--in);word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12);-webkit-user-select:none;user-select:none}
.b.me{align-self:flex-end;background:var(--out)}.b.sel{outline:2px solid var(--green);filter:brightness(.9)}
.b small{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--sub);margin-top:2px}
.b audio{height:38px;max-width:100%;display:block}.pic{display:block;max-width:100%;max-height:260px;border-radius:7px;margin-bottom:3px;cursor:pointer}
.day{align-self:center;background:var(--in);color:var(--sub);font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0}
.bar,#rec{display:flex;gap:8px;padding:8px;align-items:center}
.bar input{flex:1;padding:11px 16px;border-radius:24px;border:0;background:var(--panel)}
.send{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
#rec{display:none}#rec b{flex:1;color:#e53935}
.selb{position:absolute;top:0;left:0;right:0;display:none;z-index:2}.selb.on{display:flex}.selb h1{flex:none!important;margin-right:auto}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.on{display:flex}
.card{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-height:88%;overflow-y:auto}.card h2{font-size:17px;margin-bottom:8px}
.card input[type=text],.card input[type=tel],.card input[type=password],.card select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
.acts{display:flex;justify-content:flex-end;gap:18px;margin-top:14px;color:var(--green);font-weight:600}
.lnk{color:var(--green);font-weight:600;padding:8px 0;display:block}
.err{color:#e53935;font-size:13px;min-height:18px;margin-top:6px}
.pc{display:flex;justify-content:center;margin:6px 0;position:relative}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0;width:100%;text-align:left}.mrow .name{flex:1}
.sw{display:flex;gap:10px;margin-top:8px}.sw button{width:30px;height:30px;border-radius:50%}
.stp{border-radius:12px;padding:14px;margin:8px 0}.stp textarea{width:100%;min-height:110px;background:none;border:0;outline:0;color:#fff;font-weight:600;font-size:20px;font-family:inherit;text-align:center;resize:none}
#vw{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;color:#fff}#vw.on{display:flex}#vw>img{max-width:100%;max-height:100%}
.pg{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}.pg i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}.pg i.d{background:#fff}.pg i.a::after{content:"";display:block;height:100%;background:#fff;animation:fl 5s linear forwards}@keyframes fl{from{width:0}to{width:100%}}
.vh{position:absolute;top:24px;left:12px;display:flex;gap:10px;align-items:center}
.vt{font-weight:600;font-size:24px;text-align:center;padding:30px;white-space:pre-wrap}.vc{position:absolute;bottom:30px;left:0;right:0;text-align:center;padding:0 20px;text-shadow:0 1px 3px #000}
#boot{position:absolute;inset:0;z-index:20;background:var(--panel);display:flex;align-items:center;justify-content:center;padding:24px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:85%;text-align:center}#toast.on{opacity:1}

:root[data-theme="dark"]{--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--green:#00a884;--out:#005c4b;--in:#202c33;--chat:#0b141a;--line:#222d34}
#kv,#nv,#pv,#sg{transform:translateX(100%);z-index:3}#sg{z-index:4}#nv{z-index:6}
.k #kv,.n #nv,.p #pv,.g #sg{transform:none}
.nvh{background:var(--panel);color:var(--text)}.nvh .ico{color:var(--text)}.nvh h1{font-weight:400}
.fld{display:flex;gap:16px;align-items:center;margin:16px 16px 0}.fld>svg{color:var(--sub);flex:none}.fld input,.fld select{flex:1;min-width:0;padding:16px 14px;border:1.5px solid var(--sub);border-radius:10px;background:none;color:var(--text)}.fld select{flex:none;width:130px}.fld select option{color:#111}
.sl{position:relative}.sl label{position:absolute;top:-9px;left:10px;background:var(--panel);padding:0 4px;margin:0;font-size:12px}
.tg{width:52px;height:30px;border-radius:15px;background:var(--sub);position:relative;flex:none}.tg.on{background:#1da851}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on::after{left:25px}
.nvs{margin:auto 16px calc(16px + env(safe-area-inset-bottom,0px));padding:16px;border-radius:28px;background:var(--green);color:#fff;font-weight:600;font-size:16px}.nvs.dim{background:var(--line);color:var(--sub)}
.kr{padding:10px 14px}.gi{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}.kr b{font-size:17px}
.pav{position:relative;width:150px;height:150px;margin:28px auto 18px}.pcam{position:absolute;right:0;bottom:0;width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:3px solid var(--panel)}
.pr{display:flex;gap:18px;padding:12px 20px 0;width:100%;text-align:left;align-items:flex-start}.pr>svg{color:var(--sub);margin-top:2px;flex:none}.pr .pm{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:12px}.pr small{display:block;color:var(--sub);font-size:13px}.pr .pv2{font-size:16px;display:flex;align-items:center;gap:5px;word-break:break-word}.pr .ed{color:var(--green);margin-top:8px}.pn{color:var(--sub);font-size:13px;padding:8px 20px 4px 62px}
.call{position:absolute;inset:0;background:#0b141a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 20px 40px;z-index:30}.call.on{display:flex}
.ci{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:1}.ci h2{margin:14px 0 4px;display:flex;align-items:center;justify-content:center;gap:6px}.ci p{color:#aebac1;font-size:14px}.call .av{margin:0 auto}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
#lv{position:absolute;right:14px;top:14px;width:96px;height:132px;object-fit:cover;border-radius:10px;background:#222;display:none;transform:scaleX(-1);z-index:2}
.cb{display:flex;gap:22px;position:relative;z-index:1}.rb{width:58px;height:58px;border-radius:50%;background:#2a3942;color:#fff;display:grid;place-items:center}.rb.off{background:#fff;color:#111}.red{background:#e53935}.red svg{transform:rotate(135deg)}.grn{background:#21c063}
</style>
</head>

  <section class="view" id="pv"><div class="top"><button class="ico" data-a="pb" id="bpb" aria-label="Kembali"></button><h1>Profil</h1></div><div class="list" id="pl"></div><input type="file" id="ft" accept="image/*" hidden></section>
  <section class="view" id="sg"><div class="top"><button class="ico" data-a="sb" id="bsb" aria-label="Kembali"></button><h1>Pengaturan</h1></div><div class="list" id="sl"></div></section>
  <div class="call" id="call"></div>
  <div class="modal" id="m"><div class="card" id="mc"></div></div>
  <div id="vw"></div>
  <div id="boot"><div class="note" id="bootc">Menghubungkan…</div></div>
</div>

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function hm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function dl(t){var d=new Date(t);return d.toDateString()===new Date().toDateString()?'Hari ini':d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function av(o,s){o=o||{name:'?'};return '<div class="av" style="width:'+s+'px;height:'+s+'px;background:'+col(o.name)+';font-size:'+Math.round(s*.4)+'px">'+(o.photo?'<img src="'+o.photo+'" alt="">':esc((o.name||'?').charAt(0).toUpperCase()))+'</div>'}
function isAdm(n){return ADMINS.indexOf(String(n||'').replace(/\D/g,''))>-1}
function vb(o){return o&&isAdm(o.phone)?BADGE:''}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2800)}
function ccOpts(sel){return CC.map(function(c){return '<option value="'+c[1]+'"'+(c[1]===sel?' selected':'')+'>'+c[2]+' +'+c[1]+' ('+c[0]+')</option>'}).join('')}
function fullNum(cc,v){v=String(v).replace(/\D/g,'').replace(/^0+/,'');if(v.indexOf(cc)===0&&v.length>cc.length+7)v=v.slice(cc.length);if(cc==='62'&&!/^8\d{8,11}$/.test(v))return '';var r=cc+v;return /^\d{6,13}$/.test(v)&&r.length>=8&&r.length<=16?r:''}
function modal(h){$('mc').innerHTML=h;$('m').classList.add('on')}
function closeM(){$('m').classList.remove('on')}
function shrink(f,max,sq,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var c=document.createElement('canvas'),k=Math.min(1,max/Math.max(i.width,i.height));if(sq){c.width=c.height=max;var s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,max,max)}else{c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height)}cb(c.toDataURL('image/jpeg',sq?.8:.7))};i.src=r.result};r.readAsDataURL(f)}

/* ===== Lapisan database (Supabase) ===== */
function mkDB(url,key){
  var sb=window.supabase.createClient(url,key);
  var R=function(p){return p.then(function(r){if(r.error)throw r.error;return r.data})};
  return{
    uid:function(){return sb.auth.getSession().then(function(r){var s=r.data.session;if(s)return s.user.id;return sb.auth.signInAnonymously().then(function(x){if(x.error)throw x.error;return x.data.session.user.id})})},
    me:function(id){return R(sb.from('profiles').select('*').eq('id',id).maybeSingle())},
    reg:function(id,phone,name){return R(sb.from('profiles').insert({id:id,phone:phone,name:name}))},
    upd:function(id,patch){return R(sb.from('profiles').update(patch).eq('id',id))},
    byPhone:function(p){return R(sb.from('profiles').select('*').eq('phone',p).maybeSingle())},
    profs:function(ids){return R(sb.from('profiles').select('*').in('id',ids))},
    msgs:function(id){return R(sb.from('messages').select('*').or('sender_id.eq.'+id+',recipient_id.eq.'+id).order('created_at').limit(1500))},
    send:function(m){return R(sb.from('messages').insert(m).select().single())},
    ack:function(ids){var ps=[];for(var i=0;i<ids.length;i+=50)ps.push(R(sb.from('messages').update({status:2}).in('id',ids.slice(i,i+50))));return Promise.all(ps)},
    sts:function(){return R(sb.from('statuses').select('*').gt('created_at',new Date(Date.now()-864e5).toISOString()).order('created_at'))},
    post:function(s){return R(sb.from('statuses').insert(s).select().single())},
    cts:function(id){return R(sb.from('contacts').select('*').eq('owner_id',id))},
    saveCt:function(o,p,n,u){return R(sb.from('contacts').upsert({owner_id:o,peer_id:p,name:n,un:u}))},
    sig:function(m){return R(sb.from('call_signals').insert(m))},
    sigDel:function(id){return R(sb.from('call_signals').delete().eq('from_id',id))},
    subSig:function(id,cb){return sb.channel('sig-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:'to_id=eq.'+id},function(p){cb(p.new)}).subscribe()},
    sub:function(id,h){return sb.channel('co-'+id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+id},function(p){h.inMsg(p.new)})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'sender_id=eq.'+id},function(p){h.updMsg(p.new)})
      .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},function(p){if(p.new&&p.new.id)h.prof(p.new)})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'statuses'},function(p){h.st(p.new)})
      .subscribe(function(s){if(s==='SUBSCRIBED')h.ready()})}
  };
}

function renderList(){var q=$('q').value.toLowerCase(),h='';
  convs().filter(function(c){var p=S.pf[c.id]||{};return !q||dname(p).toLowerCase().indexOf(q)>-1||(p.name||'').toLowerCase().indexOf(q)>-1||(p.phone||'').indexOf(q)>-1}).forEach(function(c){var p=S.pf[c.id]||{name:'?'},m=c.last;
    h+='<button class="item" data-a="open" data-id="'+c.id+'">'+av(p,46)+'<div class="meta"><div class="row"><span class="name">'+esc(dname(p))+vb(p)+'</span><span class="time">'+hm(m.created_at)+'</span></div><div class="last">'+(m.sender_id===S.uid?tick(m.status):'')+'<span>'+esc(prev(m))+'</span>'+(c.n?'<b class="cnt">'+c.n+'</b>':'')+'</div></div></button>'});
  $('list').innerHTML=h||'<div class="empty">Belum ada chat. Ketuk + lalu masukkan nomor HP temanmu.</div>';
  $('bprof').innerHTML=av(S.me,32)}
function renderMsgs(){var p=S.pf[S.cur],h='',pd='',keep=$('msgs').scrollTop,atEnd=$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<80;
  S.msgs.filter(function(m){return peerOf(m)===S.cur&&vis(m)}).forEach(function(m){var d=dl(m.created_at),me=m.sender_id===S.uid;if(d!==pd){h+='<div class="day">'+d+'</div>';pd=d}if(isCall(m)){h+='<div class="day">'+esc(ctxt(m))+'</div>';return}

/* ===== Data ===== */
function need(ids){ids=ids.filter(function(i,k){return i&&!S.pf[i]&&ids.indexOf(i)===k});return ids.length?DB.profs(ids).then(function(r){r.forEach(function(p){S.pf[p.id]=p})}):Promise.resolve()}
function ackAll(){var ids=S.msgs.filter(function(m){return m.recipient_id===S.uid&&m.status<2}).map(function(m){return m.id});if(!ids.length)return Promise.resolve();ids.forEach(function(i){S.msgs.forEach(function(m){if(m.id===i)m.status=2})});return DB.ack(ids).catch(function(){})}
function reload(){return DB.msgs(S.uid).then(function(r){S.msgs=r;return DB.sts()}).then(function(r){S.sts=r;return loadCt()}).then(function(){return need(S.msgs.map(peerOf).concat(S.sts.map(function(s){return s.owner_id})).concat(Object.keys(S.ct)))}).then(ackAll).then(renderAll).catch(function(e){toast('Gagal memuat data: '+(e.message||e))})}
function onIn(m){if(S.msgs.some(function(x){return x.id===m.id}))return;S.msgs.push(m);need([m.sender_id]).then(function(){ackAll();if(S.cur===m.sender_id){S.read[S.cur]=Date.now();saveLoc()}else toast('Pesan baru dari '+dname(S.pf[m.sender_id]));renderAll()})}
function onUpd(m){S.msgs.forEach(function(x){if(x.id===m.id)x.status=m.status});renderAll()}
function onProf(p){S.pf[p.id]=p;if(p.id===S.uid)S.me=p;renderAll()}
function onSt(s){if(!S.sts.some(function(x){return x.id===s.id})){S.sts.push(s);need([s.owner_id]).then(function(){if(S.tab==='s')renderSt()})}}

function setup(){$('bootc').innerHTML='<div class="card" style="box-shadow:0 1px 8px rgba(0,0,0,.15)"><h2>Sambungkan Supabase</h2><p class="time">Salin dari Supabase: Project Settings, API. Untuk publik, isi dua nilai itu di bagian PENGATURAN pada file ini.</p><label>Project URL</label><input type="text" id="su" placeholder="https://xxxx.supabase.co" autocomplete="off"><label>Anon public key</label><input type="password" id="sk" autocomplete="off"><div class="acts"><button data-a="ssave">Simpan</button></div></div>'}
function boot(){var url=CFG.url||localStorage.getItem('co-url'),key=CFG.key||localStorage.getItem('co-key');
  if(!url||!key||key.indexOf('PASTE')===0){setup();return}

var CL=null,ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function sgTo(peer,cid,kind,data){if(!DB.sig)return Promise.resolve();return DB.sig({from_id:S.uid,to_id:peer,call_id:cid,kind:kind,data:data||{}}).catch(function(){})}
function sg(kind,data){return CL?sgTo(CL.peer,CL.id,kind,data):Promise.resolve()}
function setTxt(t){var e=$('cs');if(e)e.textContent=t}
function callUi(txt,ring){var c=CL,p=c.p,btns;
  if(ring)btns='<button class="rb red" data-a="endc" aria-label="Tolak">'+ic('ph',26)+'</button><button class="rb grn" data-a="ansc" aria-label="Terima">'+ic('ph',26)+'</button>';
  else btns='<button class="rb" data-a="mute" aria-label="Bisukan">'+ic('mic',26)+'</button>'+(c.video?'<button class="rb" data-a="cam" aria-label="Kamera">'+ic('vid',26)+'</button>':'')+'<button class="rb red" data-a="endc" aria-label="Akhiri">'+ic('ph',26)+'</button>';
  $('call').innerHTML='<video id="rv" autoplay playsinline></video><video id="lv" autoplay muted playsinline></video><div class="ci" id="ci">'+av(p,96)+'<h2>'+esc(dname(p))+vb(p)+'</h2><p id="cs">'+txt+'</p></div><div class="cb">'+btns+'</div>';$('call').classList.add('on')}
function media(v){if(!navigator.mediaDevices)return Promise.reject(new Error('Perangkat tidak mendukung panggilan'));return navigator.mediaDevices.getUserMedia({audio:true,video:v?{facingMode:'user'}:false}).then(function(s){if(!CL){s.getTracks().forEach(function(t){t.stop()});throw new Error('batal')}CL.ls=s;if(v){var l=$('lv');l.srcObject=s;l.style.display='block'}})}
function mkPC(){var pc=new RTCPeerConnection(ICE);CL.pc=pc;if(CL.ls)CL.ls.getTracks().forEach(function(t){pc.addTrack(t,CL.ls)});
  pc.onicecandidate=function(e){if(e.candidate)sg('ice',{c:e.candidate.toJSON()})};
  pc.ontrack=function(e){var r=$('rv');if(r){r.srcObject=e.streams[0];if(CL&&CL.video){r.style.display='block';$('ci').style.display='none'}var pl=r.play();if(pl&&pl.catch)pl.catch(function(){})}};
  pc.onconnectionstatechange=function(){if(!CL)return;if(pc.connectionState==='connected'&&!CL.t0){CL.t0=Date.now();setTxt('0:00')}else if(pc.connectionState==='failed')endCall('terputus')};return pc}
function flush(){if(!CL||!CL.pc)return;CL.cand.splice(0).forEach(function(c){CL.pc.addIceCandidate(c).catch(function(){})})}
function startCall(v){var p=S.pf[S.cur];if(!p)return;if(CL)return toast('Kamu sedang dalam panggilan.');if(!DB.sig)return toast('Fitur telepon belum aktif.');
  CL={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),peer:p.id,p:p,video:v,out:1,t0:0,cand:[],ts0:Date.now()};callUi('Memanggil\u2026');CL.tick=setInterval(callTick,1000);var id=CL.id;
  media(v).then(function(){mkPC();return CL.pc.createOffer()}).then(function(o){return CL.pc.setLocalDescription(o)}).then(function(){return sg('invite',{video:v,fn:S.me.name,sdp:CL.pc.localDescription.sdp})}).catch(function(e){if(CL&&CL.id===id){endCall('gagal',1);toast(e&&e.name==='NotAllowedError'?'Izinkan akses mikrofon dan kamera.':'Panggilan gagal: '+(e.message||e))}})}
A.call=function(){startCall(0)};A.vcall=function(){startCall(1)};
function onSig(r){var k=r.kind,d=r.data||{};
  if(k==='invite'){if(CL){sgTo(r.from_id,r.call_id,'busy');return}if(Date.now()-Date.parse(r.created_at)>45000)return;
    need([r.from_id]).then(function(){if(CL)return;CL={id:r.call_id,peer:r.from_id,p:S.pf[r.from_id]||{name:d.fn||'?'},video:!!d.video,in:1,t0:0,cand:[],ts0:Date.now(),offer:d.sdp};callUi(d.video?'Video call masuk':'Panggilan suara masuk',1);CL.tick=setInterval(callTick,1000);sg('ringing')});return}
  if(!CL||r.call_id!==CL.id)return;
  if(k==='ringing'){if(CL.out&&!CL.t0)setTxt('Berdering\u2026')}
  else if(k==='answer'){CL.pc.setRemoteDescription({type:'answer',sdp:d.sdp}).then(flush).catch(function(){})}
  else if(k==='ice'){if(CL.pc&&CL.pc.remoteDescription)CL.pc.addIceCandidate(d.c).catch(function(){});else CL.cand.push(d.c)}
  else if(k==='decline')endCall('ditolak',1);else if(k==='busy')endCall('sibuk',1);else if(k==='end')endCall(CL.t0?'':(CL.in?'tak terjawab':'tidak dijawab'),1)}
A.ansc=function(){var c=CL;if(!c||!c.in||c.ans)return;c.ans=1;callUi('Menyambungkan\u2026');
  media(c.video).then(function(){mkPC();return CL.pc.setRemoteDescription({type:'offer',sdp:c.offer})}).then(function(){flush();return CL.pc.createAnswer()}).then(function(a){return CL.pc.setLocalDescription(a)}).then(function(){return sg('answer',{sdp:CL.pc.localDescription.sdp})}).catch(function(e){if(CL&&CL.id===c.id){endCall('gagal');toast(e&&e.name==='NotAllowedError'?'Izinkan akses mikrofon dan kamera.':'Panggilan gagal: '+(e.message||e))}})};
function callTick(){if(!CL)return;if(CL.t0){setTxt(fmt((Date.now()-CL.t0)/1000));return}if(Date.now()-CL.ts0>45000)endCall(CL.in?'tak terjawab':'tidak dijawab')}
function endCall(why,noSig){if(!CL)return;var c=CL;CL=null;clearInterval(c.tick);try{if(c.pc)c.pc.close()}catch(e){}if(c.ls)c.ls.getTracks().forEach(function(t){t.stop()});$('call').classList.remove('on');$('call').innerHTML='';
